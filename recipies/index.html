<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeBook - Apple Crisp</title>

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Title">
    <meta property="og:description" content="Your Description">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Your Title">
    <meta name="twitter:description" content="Your Description">
    <meta name="twitter:image" content="social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header class="header">
      <img src="images/recipe-book.png" alt="Recipe Book Logo" class="logo">
      <h1>RECIPEBOOK</h1>
    </header>

    <div class="search-area">
      <input type="text" placeholder="Find a recipe" aria-label="Find a recipe">
      <button type="submit" aria-label="Search">
            <img src="images/search.svg" alt="" aria-hidden="true" class="search-icon" style="width: 20px; height: 20px;">
        </button>
    </div>

    <main>
      <article class="recipe-card">
        <div class="recipe-image">
          <img src="images\apple-crisp.jpg" alt="Bowl of apple crisp topped with vanilla ice cream">
        </div>
        
        <div class="recipe-content">
          <span class="tag">dessert</span>
          <h2 class="recipe-title">APPLE CRISP</h2>
          
          <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star-empty">☆</span>
          </span>

          <p class="recipe-description">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
        </div>
      </article>
    </main>

    <footer class="footer">
      <div class="attribution">
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
      </div>
      
      <div class="social">
        <a href="#"><img src="images\instagram_icon.svg" alt="instagram icon"></a>
        <a href="#"><img src="images\youtube_icon.svg" alt="youtube icon"></a>
        <a href="#"><img src="images\pinterest_icon.svg" alt="pinterest icon"></a>
      </div>
    </footer>
  </div>

</body>
</html>
